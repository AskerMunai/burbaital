<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Дашборд добычи</title>
<style>
:root{color-scheme:light dark;--bg:#f3f4f6;--card:#fff;--ink:#1f3344;--ink2:#5a6672;--line:#d9dee3;--acc:#1f3344;--bad:#b23a3a}
@media (prefers-color-scheme:dark){:root{--bg:#111417;--card:#181c20;--ink:#e8edf2;--ink2:#a9b3bc;--line:#2f363e;--acc:#9cc0ee;--bad:#ef8080}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
  font:15px/1.45 "Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px;width:100%;max-width:380px}
h1{font-size:19px;margin:0 0 6px} p{color:var(--ink2);margin:0 0 18px;font-size:14px}
input[type=password]{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
label.r{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink2);margin:12px 0 16px}
button{width:100%;font:inherit;font-weight:600;padding:11px;border:0;border-radius:8px;background:var(--acc);color:var(--card);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13.5px;min-height:20px;margin-top:10px}
</style></head>

</form>

const KEY = "enc:" + P.s;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function derive(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt:b64(P.s), iterations:P.i, hash:"SHA-256"}, base, 256));
}
async function open(raw){
  const k = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.n)}, k, b64(P.c));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
const $ = id => document.getElementById(id);
const f=$("f"), pw=$("pw"), rm=$("rm"), b=$("b"), e=$("e");
const get = (st) => { try { return st.getItem(KEY); } catch(_) { return null; } };
const saved = get(sessionStorage) || get(localStorage);   // ключ из этой вкладки (портал) или «запомнить»
if (saved) f.style.visibility = "hidden";
window.addEventListener("load", async () => {   // открыть без пароля, если ключ уже есть
  if (!saved) return;
  try { await open(b64(saved)); }
  catch(_) { try{ sessionStorage.removeItem(KEY); localStorage.removeItem(KEY); }catch(_){} f.style.visibility = "visible"; }
});
f.onsubmit = async ev => {
  ev.preventDefault(); e.textContent = ""; b.disabled = true; b.textContent = "Проверка…";
  try {
    const raw = await derive(pw.value);
    const k64 = btoa(String.fromCharCode(...raw));
    await open(raw);                                 // сначала проверка: неверный пароль сюда не дойдёт
    try { sessionStorage.setItem(KEY, k64); } catch(_){}
    if (rm.checked) { try { localStorage.setItem(KEY, k64); } catch(_){} }
  } catch(_) {
    e.textContent = "Неверный пароль"; b.disabled = false; b.textContent = "Открыть"; pw.select();
  }
};
})();
